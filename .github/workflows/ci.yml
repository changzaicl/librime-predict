name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v5
      - name: Install clang-format
        run: sudo apt install -y clang-format
      - name: Lint
        run: find src tools -name '*.cc' -o -name '*.h' | xargs clang-format -Werror --dry-run || { echo Please lint your code by '"'"find src tools -name '*.cc' -o -name '*.h' | xargs clang-format -i"'"'.; false; }

  build:
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - name: Checkout librime
        uses: actions/checkout@v5
        with:
          repository: rime/librime
          submodules: recursive

      - name: Checkout last commit
        uses: actions/checkout@v5
        with:
          path: plugins/predict

      # 关键：在 build Job 中安装 Boost
      - name: Install Boost dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev

      - name: Install dependency
        run: ./action-install-linux.sh

      - name: Build librime with plugin
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_ASAN=ON
          cmake --build build

      - name: Build predict.db
        working-directory: build/bin
        run: |
          # 检查训练数据
          test -f ../../plugins/predict/data/predict.txt || {
            echo "Error: predict.txt not found!"
            exit 1
          }

          # 检查生成工具
          test -x plugins/predict/bin/build_predict || {
            echo "Error: build_predict not found!"
            exit 1
          }

          # 使用自己的 predict.txt 生成数据库
          cat ../../plugins/predict/data/predict.txt | plugins/predict/bin/build_predict

          # 检查生成结果
          ls -lh predict.db

      - name: Upload predict.db
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: predict-db
          path: build/bin/predict.db
          if-no-files-found: warn
          retention-days: 30
    
      - name: Test
        working-directory: build/bin
        run: |
          cp ../../plugins/predict/data/luna_pinyin.custom.yaml .
          echo -e 'nihao \n ' | ./rime_api_console | tee log
          grep 'commit: 嗎' log
